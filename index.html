<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mono MD</title>
<style>
html,body{height:100%;margin:0}
body{color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
.wrap{max-width:980px;margin:0 auto}
#editor,#preview{
  width:100%;
  height:calc(100vh - 24px);
  box-sizing:border-box;
  padding:32px 24px;
  border:none;
  outline:none;
  resize:none;
  background:none;
  color:inherit;
  font:16px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;
  tab-size:2
}
#editor::placeholder{color:#999}
#preview{display:none;overflow:auto;white-space:normal}
#footer{
  position:fixed;
  right:0;
  bottom:0;
  height:24px;
  padding:0 24px;
  box-sizing:border-box;
  font:12px/24px ui-monospace,SFMono-Regular,Menlo,monospace;
  opacity:.45;
  text-align:right
}
#preview h1,#preview h2,#preview h3,#preview h4,#preview h5,#preview h6{font-weight:700;margin:.8em 0 .4em;line-height:1.3}
#preview h1{font-size:1.8em}
#preview h2{font-size:1.5em}
#preview h3{font-size:1.25em}
#preview h4{font-size:1.1em}
#preview h5{font-size:1em}
#preview h6{font-size:.9em;color:#666}
#preview p{margin:.6em 0}
#preview a{color:inherit;text-decoration:underline}
#preview strong{font-weight:700}
#preview em{font-style:italic}
#preview del{opacity:.55}
#preview ul,#preview ol{margin:.6em 0;padding-left:1.6em}
#preview li{margin:.2em 0}
#preview li.task{list-style:none;margin-left:-1.4em}
#preview li.task input{margin-right:.4em;vertical-align:middle}
#preview blockquote{margin:.8em 0;padding:.2em 0 .2em 1em;border-left:3px solid #ddd;color:#555}
#preview pre{margin:.8em 0;padding:12px 16px;background:#f5f5f5;border-radius:6px;overflow:auto}
#preview code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:#f0f0f0;padding:.1em .35em;border-radius:4px}
#preview pre code{background:none;padding:0;font-size:1em}
#preview hr{border:none;border-top:1px solid #ddd;margin:1.2em 0}
#preview img{max-width:100%}
#preview table{border-collapse:collapse;margin:.8em 0}
#preview th,#preview td{border:1px solid #ddd;padding:.4em .8em}
#preview th{background:#f5f5f5;font-weight:700}
#recent{display:none;position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:10}
#recentList{
  max-width:560px;
  margin:12vh auto 0;
  background:#fff;
  border-radius:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.2);
  overflow:hidden;
  font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace
}
.ritem{padding:10px 16px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem.sel{background:#f0f0f0}
.rempty{padding:16px;color:#999}
@media print{
  html,body{height:auto}
  #preview{height:auto;overflow:visible;padding:0;overflow-wrap:anywhere;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #preview pre{white-space:pre-wrap;overflow:visible}
  #preview h1,#preview h2,#preview h3,#preview h4,#preview h5,#preview h6{break-after:avoid}
  #preview pre,#preview blockquote,#preview tr{break-inside:avoid}
  #footer{display:none}
  #recent{display:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <textarea id="editor" spellcheck="false" placeholder="Cmd + O        Open file&#10;Cmd + Shift + O  Recent files&#10;Cmd + S        Save file&#10;Cmd + /        Markdown preview&#10;&#10;Drop a file here to open it.&#10;.md files support preview.&#10;Other files are edited as plain text."></textarea>
  <div id="preview"></div>
</div>
<div id="footer">untitled</div>
<div id="recent"><div id="recentList"></div></div>

<script>
const e = document.getElementById('editor')
const p = document.getElementById('preview')
const footer = document.getElementById('footer')
const recentBox = document.getElementById('recent')
const recentList = document.getElementById('recentList')

let mode = 'raw'
let handle = null
let fileName = 'untitled'
let dirty = false
let recentItems = []
let recentSel = 0

function renderFooter(){
  // A leading dot marks an unsaved buffer; it disappears once the file is saved.
  footer.textContent = (dirty ? '● ' : '') + fileName
}

function setFileName(name){
  fileName = name || 'untitled'
  renderFooter()
}

function setDirty(v){
  if(dirty !== v){
    dirty = v
    renderFooter()
  }
  // Every edit (typing, or the Tab/Enter helpers that call setDirty directly)
  // schedules an autosave of the unsaved buffer to the drafts store.
  if(v) scheduleDraft()
}

e.addEventListener('input', () => setDirty(true))

// setRangeText() edits bypass the textarea's native undo stack, so programmatic
// edits go through execCommand instead — deprecated, but the only API that keeps
// undo/redo (Cmd+Z / Cmd+Shift+Z) working. It also fires 'input', so setDirty
// is handled by the listener above.
function editRange(text, start, end){
  e.setSelectionRange(start, end)
  if(text === '') document.execCommand('delete')
  else document.execCommand('insertText', false, text)
}

// Tab moves focus by default; in the editor it should indent instead.
e.addEventListener('keydown', ev => {
  if(ev.key !== 'Tab' || ev.metaKey || ev.ctrlKey || ev.altKey) return
  ev.preventDefault()
  const s = e.selectionStart, end = e.selectionEnd
  const multiline = e.value.slice(s, end).includes('\n')

  // Single-cursor Tab just inserts a tab at the caret.
  if(!multiline && !ev.shiftKey){
    editRange('\t', s, end)
    return
  }

  // Otherwise indent/outdent every line the selection touches.
  const lineStart = e.value.lastIndexOf('\n', s - 1) + 1
  const block = e.value.slice(lineStart, end)
  const lines = block.split('\n')
  let removedFirst = 0, removedTotal = 0
  const out = lines.map((ln, i) => {
    if(!ev.shiftKey) return '\t' + ln
    const m = ln.match(/^(\t| {1,2})/) // drop one tab, or up to 2 leading spaces
    const cut = m ? m[0].length : 0
    if(i === 0) removedFirst = cut
    removedTotal += cut
    return ln.slice(cut)
  }).join('\n')

  editRange(out, lineStart, end)
  if(ev.shiftKey){
    e.selectionStart = Math.max(lineStart, s - removedFirst)
    e.selectionEnd = end - removedTotal
  }else{
    e.selectionStart = s + 1
    e.selectionEnd = end + lines.length
  }
})

// Enter on a list line continues the list on the next line. Only the current
// line is inspected, so there's no document-wide parsing.
e.addEventListener('keydown', ev => {
  if(ev.key !== 'Enter' || ev.shiftKey || ev.metaKey || ev.ctrlKey || ev.altKey) return
  if(ev.isComposing || ev.keyCode === 229) return // Enter confirming IME composition (229 covers Safari)
  if(e.selectionStart !== e.selectionEnd) return // let a range selection behave normally

  const s = e.selectionStart
  const lineStart = e.value.lastIndexOf('\n', s - 1) + 1
  let lineEnd = e.value.indexOf('\n', s)
  if(lineEnd === -1) lineEnd = e.value.length
  const line = e.value.slice(lineStart, lineEnd)

  // indent | marker (-, *, +, or "1.") | spaces | optional "[ ]" checkbox
  const m = line.match(/^(\s*)([-*+]|\d+\.)(\s+)(\[[ xX]\]\s+)?/)
  if(!m) return
  ev.preventDefault()

  const [prefix, indent, marker, space] = m
  // Empty item: pressing Enter clears the marker and exits the list.
  if(line.slice(prefix.length).trim() === ''){
    editRange('', lineStart, lineEnd)
    return
  }

  const nextMarker = /^\d+\.$/.test(marker) ? (parseInt(marker, 10) + 1) + '.' : marker
  const checkbox = m[4] ? '[ ] ' : ''
  editRange('\n' + indent + nextMarker + space + checkbox, s, s)
})

function isMarkdownFile(){
  // Unsaved buffers have no file extension yet, so treat them as Markdown
  // to allow toggling the preview before the first save.
  if(!handle) return true
  return /\.md$/i.test(fileName) || /\.markdown$/i.test(fileName)
}

function esc(s){
  return s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))
}

// Only allow http(s), mailto and relative URLs in links and images, so a
// crafted document cannot run scripts through e.g. a javascript: href.
function safeUrl(url){
  const scheme = url.match(/^([a-z][a-z0-9+.-]*):/i)
  return scheme && !/^(?:https?|mailto)$/i.test(scheme[1]) ? '#' : url
}

// Inline formatting: code spans, emphasis, strikethrough, links and images.
// Code spans are pulled out first so their contents are never re-parsed.
function inline(text){
  const codes = []
  text = text.replace(/(`+)([\s\S]+?)\1/g, (m, ticks, code) => {
    codes.push('<code>' + esc(code.replace(/^ | $/g, '')) + '</code>')
    return '\uE000C' + (codes.length - 1) + '\uE000'
  })

  text = esc(text)

  text = text
    .replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;([\s\S]*?)&quot;)?\)/g,
      (m, alt, src, title) => `<img src="${safeUrl(src)}" alt="${alt}"${title ? ` title="${title}"` : ''}>`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;([\s\S]*?)&quot;)?\)/g,
      (m, txt, href, title) => `<a href="${safeUrl(href)}"${title ? ` title="${title}"` : ''}>${txt}</a>`)
    .replace(/\*\*\*([\s\S]+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>')
    .replace(/__([\s\S]+?)__/g, '<strong>$1</strong>')
    .replace(/~~([\s\S]+?)~~/g, '<del>$1</del>')
    .replace(/\*([^*\n]+?)\*/g, '<em>$1</em>')
    .replace(/(^|[^\w])_([^_\n]+?)_(?=[^\w]|$)/g, '$1<em>$2</em>')

  return text.replace(/\uE000C(\d+)\uE000/g, (m, i) => codes[+i])
}

function splitRow(row){
  return row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim())
}

function isDelimiterRow(row){
  if(row.indexOf('-') === -1) return false
  const cells = splitRow(row)
  return cells.length > 0 && cells.every(c => /^:?-+:?$/.test(c))
}

function isTableStart(lines, i){
  return i + 1 < lines.length &&
    lines[i].indexOf('|') !== -1 &&
    isDelimiterRow(lines[i + 1])
}

function isBlockStart(lines, i){
  const l = lines[i]
  return /^(```|~~~)/.test(l)
    || /^ {0,3}#{1,6}\s/.test(l)
    || /^ {0,3}>/.test(l)
    || /^ {0,3}([-*_])([ \t]*\1){2,}[ \t]*$/.test(l)
    || /^ {0,3}([-*+]|\d+[.)])\s+/.test(l)
    || isTableStart(lines, i)
}

function parseTable(lines, i){
  const align = splitRow(lines[i + 1]).map(c => {
    const l = c.startsWith(':'), r = c.endsWith(':')
    return l && r ? 'center' : r ? 'right' : l ? 'left' : ''
  })
  const cell = (c, idx, tag) =>
    `<${tag}${align[idx] ? ` style="text-align:${align[idx]}"` : ''}>${inline(c)}</${tag}>`
  const head = splitRow(lines[i]).map((c, idx) => cell(c, idx, 'th')).join('')
  let html = '<table><thead><tr>' + head + '</tr></thead><tbody>'
  let j = i + 2
  while(j < lines.length && lines[j].indexOf('|') !== -1 && lines[j].trim() !== ''){
    html += '<tr>' + splitRow(lines[j]).map((c, idx) => cell(c, idx, 'td')).join('') + '</tr>'
    j++
  }
  return [html + '</tbody></table>', j]
}

function parseList(lines, start){
  const re = /^(\s*)([-*+]|\d+[.)])(\s+)(.*)$/
  const first = lines[start].match(re)
  const baseIndent = first[1].length
  const ordered = /\d/.test(first[2])
  const bullet = first[2]
  const textCol = first[1].length + first[2].length + first[3].length
  // A list ends when the marker class changes (e.g. `-` -> `*`, or bullet -> number),
  // so distinct lists separated only by a blank line stay separate.
  const sameMarker = mk => (/\d/.test(mk)) === ordered && (ordered || mk === bullet)
  const blank = l => /^\s*$/.test(l)
  const indentOf = l => l.match(/^\s*/)[0].length
  const items = []
  let current = null
  let i = start
  const n = lines.length
  while(i < n){
    const line = lines[i]
    if(blank(line)){
      let k = i
      while(k < n && blank(lines[k])) k++
      const m = k < n ? lines[k].match(re) : null
      const continues = k < n &&
        ((m && m[1].length === baseIndent && sameMarker(m[2])) || indentOf(lines[k]) > baseIndent)
      if(!continues) break
      for(; i < k; i++) if(current) current.push('')
      continue
    }
    const m = line.match(re)
    const indent = indentOf(line)
    if(m && m[1].length === baseIndent){
      if(!sameMarker(m[2])) break
      current = [m[4]]
      items.push(current)
      i++
    }else if(current && indent > baseIndent){
      current.push(line.slice(Math.min(indent, textCol)))
      i++
    }else{
      break
    }
  }
  let html = ordered ? '<ol>' : '<ul>'
  for(const item of items){
    while(item.length && item[item.length - 1] === '') item.pop()
    let content = item.join('\n')
    // `- [ ] task` / `- [x] task` render as a (read-only) checkbox.
    const task = content.match(/^\[([ xX])\]\s+/)
    let open = '<li>', box = ''
    if(task){
      open = '<li class="task">'
      box = `<input type="checkbox" disabled${task[1].toLowerCase() === 'x' ? ' checked' : ''}> `
      content = content.slice(task[0].length)
    }
    html += open + box + (content.indexOf('\n') === -1 ? inline(content) : md(content)) + '</li>'
  }
  return [html + (ordered ? '</ol>' : '</ul>'), i]
}

function md(src){
  const lines = src.replace(/\r\n?/g, '\n').split('\n')
  const n = lines.length
  let html = ''
  let i = 0

  while(i < n){
    const line = lines[i]

    const fence = line.match(/^(```|~~~)(.*)$/)
    if(fence){
      const marker = fence[1]
      const buf = []
      i++
      while(i < n && !lines[i].startsWith(marker)){ buf.push(lines[i]); i++ }
      i++
      html += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>'
      continue
    }

    if(/^\s*$/.test(line)){ i++; continue }

    const h = line.match(/^ {0,3}(#{1,6})\s+(.*?)\s*#*\s*$/)
    if(h){
      const lvl = h[1].length
      html += `<h${lvl}>` + inline(h[2]) + `</h${lvl}>`
      i++
      continue
    }

    if(/^ {0,3}([-*_])([ \t]*\1){2,}[ \t]*$/.test(line)){
      html += '<hr>'
      i++
      continue
    }

    if(/^ {0,3}>/.test(line)){
      const buf = []
      while(i < n && /^ {0,3}>/.test(lines[i])){
        buf.push(lines[i].replace(/^ {0,3}>\s?/, ''))
        i++
      }
      html += '<blockquote>' + md(buf.join('\n')) + '</blockquote>'
      continue
    }

    if(isTableStart(lines, i)){
      const [t, next] = parseTable(lines, i)
      html += t
      i = next
      continue
    }

    if(/^ {0,3}([-*+]|\d+[.)])\s+/.test(line)){
      const [list, next] = parseList(lines, i)
      html += list
      i = next
      continue
    }

    const buf = [line]
    i++
    while(i < n && !/^\s*$/.test(lines[i]) && !isBlockStart(lines, i)){
      buf.push(lines[i])
      i++
    }
    html += '<p>' + inline(buf.join('\n')).replace(/\n/g, '<br>') + '</p>'
  }

  return html
}

function showRaw(){
  p.style.display = 'none'
  e.style.display = 'block'
  mode = 'raw'
  e.focus()
}

function togglePreview(){
  if(!isMarkdownFile()) return

  if(mode === 'raw'){
    p.innerHTML = md(e.value)
    e.style.display = 'none'
    p.style.display = 'block'
    mode = 'preview'
  }else{
    showRaw()
  }
}

async function openFile(){
  try{
    if(!window.showOpenFilePicker){
      alert('This browser does not support the File System Access API. Use Chrome or Edge.')
      return
    }

    const [picked] = await window.showOpenFilePicker({
      multiple:false,
      excludeAcceptAllOption:false
    })

    await leaveBuffer() // preserve the document being switched away from
    handle = picked
    const file = await handle.getFile()
    e.value = await file.text()
    setFileName(file.name)
    setBufferId(null) // a freshly opened file has no unsaved draft of its own
    setDirty(false)
    await addRecent(handle, file.name)

    if(mode === 'preview') showRaw()
    else e.focus()
  }catch(err){
    if(err && err.name !== 'AbortError') console.error(err)
  }
}

// Drag & drop: dropping a file anywhere on the window opens it, same as
// Cmd+O. DataTransferItem methods only work synchronously inside the drop
// handler, so both the handle request and the fallback File are grabbed
// before the first await.
window.addEventListener('dragover', ev => ev.preventDefault())
window.addEventListener('drop', async ev => {
  ev.preventDefault()
  const item = ev.dataTransfer && ev.dataTransfer.items && ev.dataTransfer.items[0]
  if(!item || item.kind !== 'file') return
  const handlePromise = item.getAsFileSystemHandle ? item.getAsFileSystemHandle() : null
  const plainFile = item.getAsFile()
  try{
    const picked = handlePromise ? await handlePromise : null
    if(picked && picked.kind !== 'file') return // ignore dropped folders
    // Without a handle (no File System Access API) the content still opens;
    // saving will fall back to Save As.
    const file = picked ? await picked.getFile() : plainFile
    if(!file) return
    const text = await file.text()

    await leaveBuffer() // preserve the document being switched away from
    handle = picked
    e.value = text
    setFileName(file.name)
    setBufferId(null) // a freshly opened file has no unsaved draft of its own
    setDirty(false)
    if(picked) await addRecent(picked, file.name)

    if(mode === 'preview') showRaw()
    else e.focus()
  }catch(err){
    if(err && err.name !== 'AbortError') console.error(err)
  }
})

async function saveFile(){
  try{
    if(!window.showSaveFilePicker){
      alert('This browser does not support the File System Access API. Use Chrome or Edge.')
      return
    }

    if(!handle){
      handle = await window.showSaveFilePicker({
        suggestedName:fileName === 'untitled' ? 'untitled.md' : fileName
      })
      if(handle && handle.name){
        setFileName(handle.name)
        await addRecent(handle, handle.name)
      }
    }

    const w = await handle.createWritable()
    await w.write(e.value)
    await w.close()
    setDirty(false)
    await dropBufferDraft()
  }catch(err){
    if(err && err.name !== 'AbortError') console.error(err)
  }
}

// --- Recent files ---
// File handles are structured-cloneable, so they can be persisted in
// IndexedDB (localStorage only stores strings). The whole list lives in a
// single record keyed 'list' to keep ordering and trimming trivial.
const DB_NAME = 'monomd'
const STORE = 'recent'
const DRAFTS = 'drafts'
const MAX_RECENT = 10
const MAX_DRAFTS = 20

// The id of the draft record the current unsaved buffer maps to (null when the
// buffer is empty or holds a saved file). Keying drafts by the *buffer* — not
// the tab — is what prevents duplicates: recovering a draft adopts its id, so
// further edits overwrite the same record instead of spawning a copy. Mirrored
// to sessionStorage so a reload re-adopts the same draft rather than orphaning
// it. A fresh buffer mints a new id, so side-by-side tabs never collide.
let bufferId = sessionStorage.draftId || null
function newId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2)
}
function setBufferId(id){
  bufferId = id
  if(id) sessionStorage.draftId = id
  else delete sessionStorage.draftId
}

function idb(){
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 2)
    req.onupgradeneeded = () => {
      const db = req.result
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, {keyPath:'key'})
      if(!db.objectStoreNames.contains(DRAFTS)) db.createObjectStore(DRAFTS, {keyPath:'id'})
    }
    req.onsuccess = () => res(req.result)
    req.onerror = () => rej(req.error)
  })
}

async function getRecents(){
  try{
    const db = await idb()
    return await new Promise(res => {
      const req = db.transaction(STORE, 'readonly').objectStore(STORE).get('list')
      req.onsuccess = () => res(req.result ? req.result.items : [])
      req.onerror = () => res([])
    })
  }catch{ return [] }
}

async function setRecents(items){
  try{
    const db = await idb()
    await new Promise(res => {
      const tx = db.transaction(STORE, 'readwrite')
      tx.objectStore(STORE).put({key:'list', items})
      tx.oncomplete = res
      tx.onerror = res
    })
  }catch{}
}

// Add a handle to the front of the list, dropping any entry that points at
// the same file (matched by isSameEntry, not name, so distinct files sharing
// a name stay separate).
async function addRecent(h, name){
  if(!h) return
  const items = await getRecents()
  const kept = []
  for(const it of items){
    let same = false
    try{ same = await it.handle.isSameEntry(h) }catch{}
    if(!same) kept.push(it)
  }
  kept.unshift({handle:h, name, time:Date.now()})
  await setRecents(kept.slice(0, MAX_RECENT))
}

// --- Drafts (autosave) ---
// Unlike recents, each draft is its own record keyed by its buffer id (see
// bufferId), so independent buffers write independent slots. A draft holds the
// buffer text plus its first line as a title, and exists only while there is
// unsaved work to recover.
async function getDrafts(){
  try{
    const db = await idb()
    return await new Promise(res => {
      const req = db.transaction(DRAFTS, 'readonly').objectStore(DRAFTS).getAll()
      req.onsuccess = () => res(req.result || [])
      req.onerror = () => res([])
    })
  }catch{ return [] }
}

async function putDraft(rec){
  try{
    const db = await idb()
    await new Promise(res => {
      const tx = db.transaction(DRAFTS, 'readwrite')
      tx.objectStore(DRAFTS).put(rec)
      tx.oncomplete = res
      tx.onerror = res
    })
  }catch{}
}

async function deleteDraft(id){
  try{
    const db = await idb()
    await new Promise(res => {
      const tx = db.transaction(DRAFTS, 'readwrite')
      tx.objectStore(DRAFTS).delete(id)
      tx.oncomplete = res
      tx.onerror = res
    })
  }catch{}
}

// Autosave: edits to an unsaved buffer are mirrored into this tab's draft after
// a short idle, so content survives an accidentally-closed tab. The draft is
// dropped the moment it no longer represents unsaved work — saved to a real
// file (handled at the save/open sites) or emptied.
let draftTimer = 0
function scheduleDraft(){
  clearTimeout(draftTimer)
  draftTimer = setTimeout(persistDraft, 400)
}

async function persistDraft(){
  const content = e.value
  if(!dirty || !content.trim()){
    if(bufferId) await deleteDraft(bufferId)
    setBufferId(null)
    return
  }
  if(!bufferId) setBufferId(newId())
  const title = (content.split('\n').find(l => l.trim()) || 'untitled').trim().slice(0, 80)
  await putDraft({id:bufferId, title, content, time:Date.now()})

  // Keep only the most recent drafts so closed-and-forgotten tabs don't pile up.
  const all = await getDrafts()
  if(all.length > MAX_DRAFTS){
    all.sort((a, b) => b.time - a.time)
    for(const d of all.slice(MAX_DRAFTS)) if(d.id !== bufferId) await deleteDraft(d.id)
  }
}

// The current buffer has just been written to disk: its draft is now redundant,
// so drop it. (Only saving does this — switching documents keeps the draft.)
async function dropBufferDraft(){
  if(bufferId) await deleteDraft(bufferId)
  setBufferId(null)
}

// Switching documents must not lose the one you're leaving. Flush its unsaved
// content to a draft — kept, not deleted — before the next document overwrites
// the buffer. This is what lets Cmd+Shift+O act as a document switcher: every
// note you leave stays recoverable. persistDraft keeps bufferId pointing at the
// flushed draft; the caller then resets it for the document being loaded.
async function leaveBuffer(){
  clearTimeout(draftTimer)
  await persistDraft()
}

function renderRecent(){
  if(!recentItems.length){
    recentList.innerHTML = '<div class="rempty">No recent files</div>'
    return
  }
  // Drafts carry the same leading dot the footer uses for an unsaved buffer.
  recentList.innerHTML = recentItems.map((it, i) =>
    `<div class="ritem${i === recentSel ? ' sel' : ''}" data-i="${i}">${it.type === 'draft' ? '● ' : ''}${esc(it.name)}</div>`).join('')
}

async function openRecent(){
  const files = (await getRecents()).map(it =>
    ({type:'file', handle:it.handle, name:it.name, time:it.time}))
  // Hide only the draft that *is* the unsaved buffer in front of you. After a
  // reload (buffer empty, dirty false) even your own pre-reload draft shows, so
  // it can be recovered.
  const drafts = (await getDrafts())
    .filter(d => !(dirty && d.id === bufferId))
    .map(d => ({type:'draft', id:d.id, name:d.title, content:d.content, time:d.time}))
  recentItems = [...files, ...drafts].sort((a, b) => b.time - a.time)
  recentSel = 0
  renderRecent()
  recentBox.style.display = 'block'
}

function closeRecent(){
  recentBox.style.display = 'none'
  if(mode === 'raw') e.focus()
}

// A recovered draft loads as an unsaved, untitled buffer and is removed from
// the store: it now lives in this tab and will be re-persisted under this tab's
// id, so no duplicate is left behind.
async function openDraftItem(it){
  await leaveBuffer() // preserve the document being switched away from
  handle = null
  e.value = it.content
  setFileName('untitled')
  // Adopt the draft's own id (don't mint a new one) so editing it updates the
  // same record rather than leaving the original behind as a duplicate.
  setBufferId(it.id)
  setDirty(true)
  closeRecent()
  if(mode === 'preview') showRaw()
  else e.focus()
}

async function openRecentItem(i){
  const it = recentItems[i]
  if(!it) return
  if(it.type === 'draft'){ await openDraftItem(it); return }
  try{
    // Read permission does not survive a reload, so re-request it. This must
    // run from a user gesture (keypress/click), which is always the case here.
    let perm = await it.handle.queryPermission({mode:'read'})
    if(perm !== 'granted') perm = await it.handle.requestPermission({mode:'read'})
    if(perm !== 'granted') return

    const file = await it.handle.getFile()
    await leaveBuffer() // preserve the document being switched away from
    handle = it.handle
    e.value = await file.text()
    setFileName(file.name)
    setBufferId(null) // a freshly opened file has no unsaved draft of its own
    setDirty(false)
    await addRecent(it.handle, file.name)

    closeRecent()
    if(mode === 'preview') showRaw()
    else e.focus()
  }catch(err){
    if(err && err.name !== 'AbortError') console.error(err)
    closeRecent()
  }
}

recentList.addEventListener('click', ev => {
  const el = ev.target.closest('.ritem')
  if(el) openRecentItem(+el.dataset.i)
})

recentBox.addEventListener('mousedown', ev => {
  if(ev.target === recentBox) closeRecent()
})

window.addEventListener('keydown', async ev => {
  if(recentBox.style.display === 'block'){
    if(ev.key === 'Escape'){ ev.preventDefault(); closeRecent(); return }
    if(ev.key === 'ArrowDown'){
      ev.preventDefault()
      recentSel = Math.min(recentSel + 1, recentItems.length - 1)
      renderRecent()
      return
    }
    if(ev.key === 'ArrowUp'){
      ev.preventDefault()
      recentSel = Math.max(recentSel - 1, 0)
      renderRecent()
      return
    }
    if(ev.key === 'Enter'){ ev.preventDefault(); await openRecentItem(recentSel); return }
  }

  const mod = ev.metaKey || ev.ctrlKey
  if(!mod) return

  const key = ev.key.toLowerCase()

  if(key === 'o'){
    ev.preventDefault()
    ev.stopPropagation()
    if(ev.shiftKey) await openRecent()
    else await openFile()
    return
  }

  if(key === 's'){
    ev.preventDefault()
    ev.stopPropagation()
    await saveFile()
    return
  }

  if(key === '/' || ev.code === 'Slash'){
    ev.preventDefault()
    ev.stopPropagation()
    togglePreview()
    return
  }
}, true)

// Cmd+W / window close / reload cannot be intercepted directly, but
// beforeunload lets the browser show its native confirmation when there are
// unsaved edits. The message is fixed and no custom UI is possible by design.
window.addEventListener('beforeunload', ev => {
  if(dirty) ev.preventDefault()
})

// Flush the draft when the tab is hidden — usually the last reliable moment
// before it is closed — so the final keystrokes before the debounce fires
// aren't lost. (beforeunload cannot await the async IndexedDB write.)
document.addEventListener('visibilitychange', () => {
  if(document.hidden) persistDraft()
})

e.focus()
</script>
</body>
</html>
